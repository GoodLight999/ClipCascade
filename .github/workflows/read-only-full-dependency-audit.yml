name: Read-only full dependency audit

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/read-only-full-dependency-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ClipCascade_Mobile/src

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-recovery

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - name: Install exact dependency tree
        run: npm ci

      - name: Capture and summarize full audit
        run: |
          set -euo pipefail
          mkdir -p ci-logs/full-audit
          npm audit --json > ci-logs/full-audit/npm-audit-full.json || true
          node - <<'NODE' | tee ci-logs/full-audit/high-or-critical.txt
          const fs = require('fs');
          const report = JSON.parse(
            fs.readFileSync('ci-logs/full-audit/npm-audit-full.json', 'utf8'),
          );
          const findings = Object.entries(report.vulnerabilities || {})
            .filter(([, value]) => ['high', 'critical'].includes(value.severity))
            .sort(([a], [b]) => a.localeCompare(b));
          console.log(JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, value] of findings) {
            console.log(`\n${name} (${value.severity})`);
            console.log(`direct=${value.isDirect}`);
            console.log(`range=${value.range}`);
            console.log(`nodes=${JSON.stringify(value.nodes)}`);
            console.log(`via=${JSON.stringify(value.via)}`);
            console.log(`effects=${JSON.stringify(value.effects)}`);
            console.log(`fixAvailable=${JSON.stringify(value.fixAvailable)}`);
          }
          console.log(`\nhigh-or-critical-count=${findings.length}`);
          NODE

      - name: Upload complete audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-full-dependency-audit
          path: ClipCascade_Mobile/src/ci-logs/full-audit/
          if-no-files-found: error
          retention-days: 7
