name: One-shot validated UI debug

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-ui-debug.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-ui-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: stability-recovery
          fetch-depth: 0

      - name: Restore and apply byte-exact validated transformation
        run: |
          set -euo pipefail
          cat > /tmp/apply_ui_debug.py.gz.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/apply_ui_debug.py.gz.b64 \
            | base64 -d \
            | gzip -d \
            > /tmp/apply_ui_debug.py
          python /tmp/apply_ui_debug.py "$GITHUB_WORKSPACE"
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            ClipCascade_Desktop/src/main.py \
            ClipCascade_Desktop/src/pyproject.toml \
            ClipCascade_Mobile/src/App.js \
            ClipCascade_Mobile/src/__tests__/App.test.tsx \
            ClipCascade_Mobile/src/android/app/src/main/java/com/clipcascade/BackgroundSetupActivity.kt \
            ClipCascade_Mobile/src/index.js | sort)"
          test "$actual" = "$expected"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate mobile JavaScript
        working-directory: ClipCascade_Mobile/src
        run: |
          set -euo pipefail
          npm ci
          node --check App.js
          node --check StartForegroundService.js
          node --check HeadlessTask.js
          npm run lint -- --max-warnings=0
          npm test -- --runInBand

      - name: Validate Android native code and APK
        working-directory: ClipCascade_Mobile/src/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:lintStandalone \
            :app:testDebugUnitTest \
            :app:assembleStandalone
          apk=app/build/outputs/apk/standalone/app-standalone.apk
          test -f "$apk"
          unzip -Z1 "$apk" | grep -Fxq assets/index.android.bundle
          unzip -tq "$apk"

      - name: Validate desktop source and tests
        run: |
          set -euo pipefail
          python -m pip install websocket-client==1.8.0
          python -m compileall -q ClipCascade_Desktop/src ClipCascade_Desktop/tests
          PYTHONPATH="$GITHUB_WORKSPACE/ClipCascade_Desktop/src" \
            python -m unittest discover \
              -s ClipCascade_Desktop/tests \
              -p 'test_*.py' \
              -v

      - name: Commit only validated product changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ClipCascade_Desktop/src/main.py \
            ClipCascade_Desktop/src/pyproject.toml \
            ClipCascade_Mobile/src/App.js \
            ClipCascade_Mobile/src/__tests__/App.test.tsx \
            ClipCascade_Mobile/src/android/app/src/main/java/com/clipcascade/BackgroundSetupActivity.kt \
            ClipCascade_Mobile/src/index.js
          git commit -m 'fix(ui): enforce explicit high-contrast product palette'
          git push origin HEAD:stability-recovery
