name: Apply P2S retry backoff once

on:
  push:
    branches:
      - stability-recovery
    paths:
      - '.github/workflows/apply-p2s-retry-backoff.yml'
      - '.github/scripts/apply_p2s_retry_backoff.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: stability-recovery
      - name: Apply exact retry integration patch
        run: |
          python .github/scripts/apply_p2s_retry_backoff.py
          node --check ClipCascade_Mobile/src/StartForegroundService.js
      - name: Commit product change only
        run: |
          if git diff --quiet; then
            echo 'P2S retry integration is already applied.'
            exit 0
          fi
          git config user.name 'ClipCascade recovery automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ClipCascade_Mobile/src/StartForegroundService.js
          git commit -m 'mobile: apply bounded P2S retry backoff'
          git push origin HEAD:stability-recovery
