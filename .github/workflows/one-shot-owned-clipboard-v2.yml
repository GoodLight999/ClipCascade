name: One-shot generation-safe clipboard writes

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-owned-clipboard-v2.yml'
      - 'ClipCascade_Mobile/src/__tests__/OwnedClipboardContracts.test.ts'

permissions:
  contents: write

concurrency:
  group: one-shot-owned-clipboard-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: stability-recovery
          fetch-depth: 0

      - name: Restore and apply locally validated patch
        run: |
          set -euo pipefail
          cat > /tmp/app-owned-generation-v2.patch.gz.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/app-owned-generation-v2.patch.gz.b64 \
            | base64 -d \
            | gzip -d \
            > /tmp/app-owned-generation-v2.patch
          git apply --check /tmp/app-owned-generation-v2.patch
          git apply /tmp/app-owned-generation-v2.patch
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate JavaScript and contracts
        working-directory: ClipCascade_Mobile/src
        run: |
          set -euo pipefail
          npm ci
          node --check StartForegroundService.js
          npm run lint -- --max-warnings=0
          npm test -- --runInBand

      - name: Validate Android lint, tests, and APK
        working-directory: ClipCascade_Mobile/src/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:lintStandalone \
            :app:testDebugUnitTest \
            :app:assembleStandalone
          apk=app/build/outputs/apk/standalone/app-standalone.apk
          test -f "$apk"
          unzip -Z1 "$apk" | grep -Fxq assets/index.android.bundle
          unzip -tq "$apk"

      - name: Commit only validated product files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ClipCascade_Mobile/src/StartForegroundService.js \
            ClipCascade_Mobile/src/android/app/src/main/java/com/clipcascade/NativeBridgeModule.kt
          git commit -m 'fix(android): generation-safe app-owned clipboard writes'
          git push origin HEAD:stability-recovery
