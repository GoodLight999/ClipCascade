name: One-shot dependency adoption

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-dependency-adoption.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-dependency-adoption-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
        working-directory: ClipCascade_Mobile/src
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: stability-recovery
          fetch-depth: 0

      - name: Apply bounded compatible dependency update
        run: |
          set -euo pipefail
          npm pkg set devDependencies.@react-native-community/cli=19.1.2
          npm pkg set devDependencies.@react-native-community/cli-platform-android=19.1.2
          npm pkg set devDependencies.@react-native-community/cli-platform-ios=19.1.2
          npm install --package-lock-only --ignore-scripts
          # Apply only non-breaking transitive fixes available inside this
          # dependency graph. CLI 20 major changes are intentionally excluded.
          npm audit fix --package-lock-only --omit=dev || true
          git diff --check -- package.json package-lock.json
          test -n "$(git diff -- package.json package-lock.json)"

      - name: Install exact candidate tree
        run: npm ci

      - name: Enforce production high-or-higher audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate JavaScript
        run: |
          set -euo pipefail
          node --check App.js
          node --check StartForegroundService.js
          node --check HeadlessTask.js
          npm run lint -- --max-warnings=0
          npm test -- --runInBand

      - name: Validate Android lint, tests, and APK
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace \
            :app:lintStandalone \
            :app:testDebugUnitTest \
            :app:assembleStandalone
          apk=app/build/outputs/apk/standalone/app-standalone.apk
          test -f "$apk"
          unzip -Z1 "$apk" | grep -Fxq assets/index.android.bundle
          unzip -tq "$apk"

      - name: Commit only validated dependency files
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ClipCascade_Mobile/src/package.json \
            ClipCascade_Mobile/src/package-lock.json
          git commit -m 'fix(deps): update compatible React Native CLI security tree'
          git push origin HEAD:stability-recovery
