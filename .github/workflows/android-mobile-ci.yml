name: Android mobile CI

on:
  push:
    branches:
      - stability-mobile-otp
  pull_request:
    paths:
      - "ClipCascade_Mobile/src/**"
      - ".github/workflows/android-mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ClipCascade_Mobile/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Run Android unit tests
        run: cd android && ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Android-debug
          path: ClipCascade_Mobile/src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
