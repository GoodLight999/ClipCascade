name: Android standalone CI

on:
  push:
    branches:
      - stability-mobile-otp
  pull_request:
    paths:
      - "ClipCascade_Mobile/src/**"
      - ".github/workflows/android-mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: ClipCascade_Mobile/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare Extended interface
        run: node scripts/prepare_extended_bundle.js

      - name: Prepare relay transport acknowledgement
        run: node scripts/prepare_relay_transport_ack.js

      - name: Bundle JavaScript into Android assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          test -s android/app/src/main/assets/index.android.bundle

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Assemble signed standalone APK
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../android-build.log

      - name: Verify embedded bundle
        shell: bash
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.android.bundle"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Android-build-log
          path: ClipCascade_Mobile/src/android-build.log
          if-no-files-found: warn

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Extended-standalone
          path: ClipCascade_Mobile/src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
