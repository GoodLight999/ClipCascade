name: Android mobile CI

on:
  push:
    branches:
      - stability-mobile-otp
  pull_request:
    paths:
      - "ClipCascade_Mobile/src/**"
      - ".github/workflows/android-mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: ClipCascade_Mobile/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Assemble installable debug APK
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../android-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Android-build-log
          path: ClipCascade_Mobile/src/android-build.log
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-GoodLight-Android
          path: ClipCascade_Mobile/src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
