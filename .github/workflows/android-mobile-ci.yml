name: Android standalone CI

on:
  push:
    branches: [stability-mobile-otp]
  pull_request:
    paths:
      - "ClipCascade_Mobile/src/**"
      - ".github/workflows/android-mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLIPCASCADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXTENDED_TEST_CERT_SHA256: b2fd5bc5d218c18e515d46a3c431bcadc1e68d847e2dd81374785d463b2bb9b0
    defaults:
      run:
        working-directory: ClipCascade_Mobile/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare Extended interface
        run: node scripts/prepare_extended_bundle.js
      - name: Prepare Extended version identity
        run: node scripts/prepare_extended_version.js
      - name: Prepare Android package version
        run: node scripts/prepare_background_recovery_version.js
      - name: Protect shared AsyncStorage lifecycle
        run: node scripts/prepare_storage_lifecycle.js
      - name: Prepare startup service recovery and target-neutral wording
        run: node scripts/prepare_startup_service_recovery.js
      - name: Prepare canonical boot-resume control
        run: node scripts/prepare_boot_resume_ui.js
      - name: Localize displayed status
        run: node scripts/prepare_extended_status_i18n.js
      - name: Synchronize runtime control state
        run: node scripts/prepare_runtime_control_state.js
      - name: Reduce idle wakeups and restore clipboard reliability
        run: node scripts/prepare_idle_power.js
      - name: Prepare broad OTP extraction
        run: node scripts/prepare_broad_otp_extractor.js
      - name: Prepare relay transport acknowledgement
        run: node scripts/prepare_relay_transport_ack.js
      - name: Order relay startup after listeners
        run: node scripts/prepare_relay_startup_order.js
      - name: Isolate service listener lifecycle
        run: node scripts/prepare_service_listener_lifecycle.js
      - name: Prepare P2P peer acknowledgement
        run: node scripts/prepare_p2p_peer_ack.js
      - name: Order P2P ACK after validation
        run: node scripts/prepare_p2p_ack_validation_order.js
      - name: Apply final native recovery transforms
        shell: bash
        run: |
          set -o pipefail
          node scripts/prepare_relay_claim.js 2>&1 | tee gmail-transform.log

      - name: Verify transformed Extended source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "3.2.1-extended.22-alpha.1" App.js
          grep -q "versionCode 320127" android/app/build.gradle
          grep -q 'versionName "3.2.1-extended.22-alpha.1"' android/app/build.gradle

          # Existing transport runner and durable ACK path remain mandatory.
          grep -q "StartForegroundService({registerOnly: true})" index.js
          grep -q "foregroundRunnerRegistered" StartForegroundService.js
          grep -q "recordForegroundRunnerHeartbeat" StartForegroundService.js
          grep -q "drainNativeRelayQueue" StartForegroundService.js
          grep -q "claimRelayDispatch" StartForegroundService.js
          grep -q "releaseRelayDispatch" android/app/src/main/java/com/clipcascade/RelaySettingsModule.kt
          grep -q "claimForForegroundService" android/app/src/main/java/com/clipcascade/ClipboardRelayDispatcher.kt
          grep -q "claimForForegroundService" android/app/src/main/java/com/clipcascade/OtpRelayDispatcher.kt
          grep -q "EnqueueResult.QUEUE_FULL" android/app/src/main/java/com/clipcascade/ClipboardRelayStore.kt
          if grep -q "TTL_MS" android/app/src/main/java/com/clipcascade/ClipboardRelayStore.kt; then
            echo "Ordinary clipboard queue expires before peer acknowledgement" >&2
            exit 1
          fi
          if grep -q "while (pending.size" android/app/src/main/java/com/clipcascade/ClipboardRelayStore.kt; then
            echo "Ordinary clipboard queue evicts accepted unacknowledged items" >&2
            exit 1
          fi

          # Go-reference ownership: Accessibility binds a sticky native owner.
          service="android/app/src/main/java/com/clipcascade/ClipboardAcquisitionService.kt"
          accessibility="android/app/src/main/java/com/clipcascade/ClipboardAccessibilityService.kt"
          grep -q "class ClipboardAcquisitionService : Service" "$service"
          grep -q "return START_STICKY" "$service"
          grep -q "TYPE_APPLICATION_OVERLAY" "$service"
          grep -q "FLAG_NOT_TOUCHABLE" "$service"
          grep -q "FLAG_NOT_TOUCH_MODAL" "$service"
          grep -q "pre_selection_baseline" "$service"
          grep -q "ClipboardObservationStore.currentFingerprint" "$service"
          grep -q "ClipboardRelayStore.enqueue" "$service"
          grep -q 'EnqueueResult.QUEUE_FULL -> "queue_full"' "$service"
          grep -q "ClipboardAcquisitionService.LocalBinder" "$accessibility"
          grep -q "bindService" "$accessibility"
          grep -q 'trigger = "selection_probe"' "$accessibility"
          grep -q '"click_probe"' "$accessibility"
          grep -q "SystemCopyCuePolicy.matchesAny" "$accessibility"
          if grep -q "ClipboardRelayStore.enqueue" "$accessibility"; then
            echo "Accessibility bypasses native acquisition ownership" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          service = Path("android/app/src/main/java/com/clipcascade/ClipboardAcquisitionService.kt").read_text(encoding="utf-8")
          start = service.index("val params = WindowManager.LayoutParams(")
          end = service.index("try {", start)
          params = service[start:end]
          assert "FLAG_NOT_TOUCHABLE" in params
          assert "FLAG_NOT_TOUCH_MODAL" in params
          assert "FLAG_NOT_FOCUSABLE" not in params
          assert service.index("pre_selection_baseline") < service.index("observeAndQueue")
          PY
          grep -q "selectionProbeNeverSendsWithoutClipboardMutation" android/app/src/test/java/com/clipcascade/ClipboardAcquisitionPolicyTest.kt
          grep -q "realClipboardMutationSendsAfterBaseline" android/app/src/test/java/com/clipcascade/ClipboardAcquisitionPolicyTest.kt

          # Android 15+ notification trust and a genuinely external self-test.
          manifest="android/app/src/main/AndroidManifest.xml"
          grep -q "REQUEST_COMPANION_SELF_MANAGED" "$manifest"
          grep -q "android.software.companion_device_setup" "$manifest"
          grep -q 'android:name=".ClipboardAcquisitionService"' "$manifest"
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          marker = 'android:name=".NotificationCodeListenerService"'
          start = manifest.index(marker)
          end = manifest.index('</service>', start)
          listener = manifest[start:end]
          assert 'android:exported="false"' in listener
          PY
          grep -q "setSelfManaged(true)" android/app/src/main/java/com/clipcascade/CompanionAssociationHelper.kt
          grep -q "manager.myAssociations" android/app/src/main/java/com/clipcascade/CompanionAssociationHelper.kt
          grep -q "requestNotificationAccess" android/app/src/main/java/com/clipcascade/CompanionAssociationHelper.kt
          grep -q "ExternalNotificationTestStore" android/app/src/main/java/com/clipcascade/NotificationCodeListenerService.kt
          grep -q '"external_listener_test"' android/app/src/main/java/com/clipcascade/NotificationCodeListenerService.kt
          grep -q "NotificationDeliveryReceiptStore.claimIfNew" android/app/src/main/java/com/clipcascade/NotificationCodeListenerService.kt
          grep -q "com.clipcascade.extended.testnotifier" android/notification-test-sender/build.gradle
          grep -q "POST_LISTENER_TEST" android/notification-test-sender/src/main/AndroidManifest.xml
          grep -q "Your verification code is" android/notification-test-sender/src/main/java/com/clipcascade/testnotifier/TestNotificationActivity.kt

          # Existing privacy and extractor constraints.
          if grep -q "READ_LOGS" "$manifest" android/app/src/main/java/com/clipcascade/ClipboardListenerModule.kt; then
            echo "ADB READ_LOGS workaround was reintroduced" >&2
            exit 1
          fi
          grep -q "extractsPerceptronNetworkStandaloneAlphanumericCode" android/app/src/test/java/com/clipcascade/OtpCodeExtractorTest.kt
          grep -q "extractsDawnStandaloneNumericLoginCode" android/app/src/test/java/com/clipcascade/OtpCodeExtractorTest.kt
          grep -q "receiptRemainsActiveThroughTtlBoundary" android/app/src/test/java/com/clipcascade/NotificationReceiptPolicyTest.kt
          grep -q "outboundDebugNotificationEnabled" android/app/src/main/java/com/clipcascade/RelaySettingsStore.kt
          grep -q "Debug UI must never change transport acceptance or ACK behavior" StartForegroundService.js
          if grep -Fq "db?.close()" android/app/src/main/java/com/clipcascade/AsyncStorageBridge.kt; then
            echo "AsyncStorage bridge closes the shared database" >&2
            exit 1
          fi

      - name: Bundle JavaScript into Android assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
          test -s android/app/src/main/assets/index.android.bundle

      - name: Generate stable public test signing identity
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="android/app/build/generated/signing"
          python scripts/generate_stable_test_signing.py "${signing_dir}"
          openssl pkcs12 -export -inkey "${signing_dir}/clipcascade-extended-test.key.pem" -in "${signing_dir}/clipcascade-extended-test.x509.pem" -name clipcascade-test -out "${signing_dir}/clipcascade-extended-test.p12" -passout pass:clipcascade-public-test
          test -s "${signing_dir}/clipcascade-extended-test.p12"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Test and assemble both APKs
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :notification-test-sender:assembleDebug -PclipcascadeBuildSha="${CLIPCASCADE_SOURCE_SHA}" --stacktrace 2>&1 | tee ../android-build.log

      - name: Verify embedded bundle and both signers
        shell: bash
        run: |
          set -euo pipefail
          main_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          helper_apk="android/notification-test-sender/build/outputs/apk/debug/notification-test-sender-debug.apk"
          cert="android/app/build/generated/signing/clipcascade-extended-test.x509.pem"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          unzip -l "${main_apk}" | grep -q "assets/index.android.bundle"
          generated_digest="$(openssl x509 -in "${cert}" -outform DER | sha256sum | awk '{print $1}')"
          test "${generated_digest}" = "${EXTENDED_TEST_CERT_SHA256}"
          : > android-signer.log
          for apk in "${main_apk}" "${helper_apk}"; do
            "${apksigner}" verify --print-certs "${apk}" | tee -a android-signer.log
            signer_digest="$("${apksigner}" verify --print-certs "${apk}" | awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            test "${signer_digest}" = "${EXTENDED_TEST_CERT_SHA256}"
          done
          mkdir -p release-artifacts
          cp "${main_apk}" release-artifacts/ClipCascade-Extended-3.2.1-extended.22-alpha.1.apk
          cp "${helper_apk}" release-artifacts/ClipCascade-Notification-Test-Sender-22-alpha.1.apk
          sha256sum release-artifacts/*.apk | tee release-artifacts/SHA256SUMS.txt

      - name: Upload transform diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Android-transform-diagnostics
          path: ClipCascade_Mobile/src/gmail-transform.log
          if-no-files-found: warn
      - name: Upload signer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Android-signer-diagnostics
          path: ClipCascade_Mobile/src/android-signer.log
          if-no-files-found: warn
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Android-build-log
          path: ClipCascade_Mobile/src/android-build.log
          if-no-files-found: warn
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Android-unit-tests
          path: ClipCascade_Mobile/src/android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
      - name: Upload standalone and external-test APKs
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Extended-standalone
          path: ClipCascade_Mobile/src/release-artifacts
          if-no-files-found: error
