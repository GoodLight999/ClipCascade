name: Android alpha22 generated-source diagnostic

on:
  push:
    branches: [agent/alpha22-diagnosis]

permissions:
  contents: read

jobs:
  capture-generated-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ClipCascade_Mobile/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run production transforms in canonical order
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare_extended_bundle.js
          node scripts/prepare_extended_version.js
          node scripts/prepare_background_recovery_version.js
          node scripts/prepare_storage_lifecycle.js
          node scripts/prepare_startup_service_recovery.js
          node scripts/prepare_boot_resume_ui.js
          node scripts/prepare_extended_status_i18n.js
          node scripts/prepare_runtime_control_state.js
          node scripts/prepare_idle_power.js
          node scripts/prepare_broad_otp_extractor.js
          node scripts/prepare_relay_transport_ack.js
          node scripts/prepare_relay_startup_order.js
          node scripts/prepare_service_listener_lifecycle.js
          node scripts/prepare_p2p_peer_ack.js
          node scripts/prepare_p2p_ack_validation_order.js
          node scripts/prepare_relay_claim.js
      - name: Upload final generated Android sources
        uses: actions/upload-artifact@v4
        with:
          name: alpha22-final-generated-source
          path: |
            ClipCascade_Mobile/src/android/app/src/main/AndroidManifest.xml
            ClipCascade_Mobile/src/android/app/src/main/java/com/clipcascade
            ClipCascade_Mobile/src/android/app/src/main/res/values/strings.xml
            ClipCascade_Mobile/src/android/app/src/main/res/values-ja/strings.xml
            ClipCascade_Mobile/src/StartForegroundService.js
            ClipCascade_Mobile/src/index.js
          if-no-files-found: error
