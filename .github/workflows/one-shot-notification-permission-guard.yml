name: One-shot notification permission guard

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-notification-permission-guard.yml'
      - 'tools/apply_notification_permission_guard.py'

permissions:
  contents: write

concurrency:
  group: one-shot-notification-permission-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: stability-recovery
          fetch-depth: 0

      - name: Apply deterministic permission transformation
        run: |
          set -euo pipefail
          python -m py_compile tools/apply_notification_permission_guard.py
          python tools/apply_notification_permission_guard.py "$GITHUB_WORKSPACE"
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate audits, JavaScript, and contracts
        working-directory: ClipCascade_Mobile/src
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          node --check App.js
          node --check StartForegroundService.js
          node --check HeadlessTask.js
          npm run lint -- --max-warnings=0
          npm test -- --runInBand

      - name: Validate Android lint, JVM tests, and APK
        working-directory: ClipCascade_Mobile/src
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace \
            :app:lintStandalone \
            :app:testDebugUnitTest \
            :app:assembleStandalone
          apk=app/build/outputs/apk/standalone/app-standalone.apk
          test -f "$apk"
          unzip -Z1 "$apk" | grep -Fxq assets/index.android.bundle
          unzip -tq "$apk"
          sha256sum "$apk"

      - name: Commit only validated permission files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ClipCascade_Mobile/src/App.js \
            ClipCascade_Mobile/src/__tests__/NotificationPermissionContracts.test.ts
          git commit -m 'fix(android): guard notification permission by API level'
          git push origin HEAD:stability-recovery
