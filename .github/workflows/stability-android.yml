name: Stability recovery Android

on:
  push:
    branches:
      - stability-recovery
    paths:
      - 'ClipCascade_Mobile/**'
      - '.github/workflows/stability-android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ClipCascade_Mobile/**'
      - '.github/workflows/stability-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stability-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-standalone-apk:
    name: Build bundled Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ClipCascade_Mobile/src

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply validated canonical product links once
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count == expected:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  return
              if count == 0 and text.count(new) >= expected:
                  return
              raise SystemExit(
                  f'{path}: expected {expected} old occurrences or an already-patched file; found {count}'
              )

          mobile = Path('ClipCascade_Mobile/src/App.js')
          replace_exact(
              mobile,
              'https://raw.githubusercontent.com/Sathvik-Rao/ClipCascade/main/version.json',
              'https://raw.githubusercontent.com/GoodLight999/Trial-and-Error-ClipCascade/stability-recovery/version.json',
              1,
          )
          replace_exact(
              mobile,
              'https://github.com/Sathvik-Rao/ClipCascade',
              'https://github.com/GoodLight999/Trial-and-Error-ClipCascade',
              2,
          )
          replace_exact(
              mobile,
              '${GITHUB_URL}/blob/main/README.md',
              '${GITHUB_URL}/blob/stability-recovery/docs/ANDROID_SETUP.md',
              1,
          )
          replace_exact(
              mobile,
              'https://raw.githubusercontent.com/Sathvik-Rao/ClipCascade/main/metadata.json',
              'https://raw.githubusercontent.com/GoodLight999/Trial-and-Error-ClipCascade/stability-recovery/metadata.json',
              1,
          )

          desktop = Path('ClipCascade_Desktop/src/core/constants.py')
          replace_exact(
              desktop,
              'https://raw.githubusercontent.com/Sathvik-Rao/ClipCascade/main/version.json',
              'https://raw.githubusercontent.com/GoodLight999/Trial-and-Error-ClipCascade/stability-recovery/version.json',
              1,
          )
          replace_exact(
              desktop,
              'https://github.com/Sathvik-Rao/ClipCascade',
              'https://github.com/GoodLight999/Trial-and-Error-ClipCascade',
              2,
          )
          replace_exact(
              desktop,
              'f"{GITHUB_URL}/blob/main/README.md"',
              'f"{GITHUB_URL}/blob/stability-recovery/README.md"',
              1,
          )
          replace_exact(
              desktop,
              'https://raw.githubusercontent.com/Sathvik-Rao/ClipCascade/main/metadata.json',
              'https://raw.githubusercontent.com/GoodLight999/Trial-and-Error-ClipCascade/stability-recovery/metadata.json',
              1,
          )
          PY

          ! grep -n 'Sathvik-Rao/ClipCascade' ClipCascade_Mobile/src/App.js
          ! grep -n 'Sathvik-Rao/ClipCascade' ClipCascade_Desktop/src/core/constants.py
          python -m py_compile ClipCascade_Desktop/src/core/constants.py

          if ! git diff --quiet; then
            git config user.name 'ClipCascade recovery automation'
            git config user.email 'actions@users.noreply.github.com'
            git add ClipCascade_Mobile/src/App.js ClipCascade_Desktop/src/core/constants.py
            git commit -m 'meta: point product links at recovery canonical sources'
            git push origin HEAD:stability-recovery
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate app code, run app tests, and build standalone APK
        run: |
          mkdir -p ci-logs/android
          chmod +x android/gradlew
          set -o pipefail
          (cd android && ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleStandalone) 2>&1 | tee ci-logs/android/gradle-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-stability-android-build-log
          path: ClipCascade_Mobile/src/ci-logs/android/gradle-build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Verify bundled JavaScript and stage APK
        run: |
          APK_PATH=android/app/build/outputs/apk/standalone/app-standalone.apk
          test -f "$APK_PATH"
          unzip -Z1 "$APK_PATH" | grep -Fxq 'assets/index.android.bundle'
          unzip -tq "$APK_PATH"
          mkdir -p ci-artifacts/android
          cp "$APK_PATH" ci-artifacts/android/ClipCascade-Android-stability-standalone.apk
          cd ci-artifacts/android
          sha256sum ClipCascade-Android-stability-standalone.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload installable engineering APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Android-stability-standalone
          path: ClipCascade_Mobile/src/ci-artifacts/android/
          if-no-files-found: error
          retention-days: 30
