name: One-time verified JavaScript repair

on:
  push:
    branches:
      - stability-recovery
    paths:
      - 'ClipCascade_Mobile/**'
      - '.github/workflows/stability-android.yml'
      - '.github/workflows/one-shot-eslint-repair.yml'

permissions:
  contents: write

concurrency:
  group: one-time-mobile-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-verify-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the active branch
        uses: actions/checkout@v4
        with:
          ref: stability-recovery

      - name: Apply the locally verified repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return source.replace(old, new, 1)

          app_path = Path('ClipCascade_Mobile/src/App.js')
          app = app_path.read_text(encoding='utf-8')
          app = once(app, '  Image,\n', '', 'unused Image import')
          app = once(
              app,
              '  getMultipleDataFromAsyncStorage,\n  clearAsyncStorage,\n',
              '',
              'unused App storage imports',
          )
          app = once(
              app,
              "  const [donateUrl, setDonateUrl] = useState(null);\n",
              '',
              'obsolete donation state',
          )
          app = once(
              app,
              "  const METADATA_URL =\n    'https://raw.githubusercontent.com/GoodLight999/Trial-and-Error-ClipCascade/stability-recovery/metadata.json';\n",
              '',
              'obsolete metadata URL',
          )
          app = once(
              app,
              '  // Request permissions for notifications\n  PermissionsAndroid.request(PermissionsAndroid.PERMISSIONS.POST_NOTIFICATIONS);\n\n',
              '',
              'render-time permission request',
          )
          app = once(
              app,
              "  const fetchTimeout = async (input, init, timeout_ms = FETCH_TIMEOUT) => {\n    try {\n      const controller = new AbortController();\n      const timeoutId = setTimeout(() => controller.abort(), timeout_ms);\n      return await fetch(input, { ...init, signal: controller.signal });\n    } catch (e) {\n      throw e;\n    }\n  };",
              "  const fetchTimeout = async (input, init, timeout_ms = FETCH_TIMEOUT) => {\n    const controller = new AbortController();\n    const timeoutId = setTimeout(() => controller.abort(), timeout_ms);\n    try {\n      return await fetch(input, { ...init, signal: controller.signal });\n    } finally {\n      clearTimeout(timeoutId);\n    }\n  };",
              'fetch timeout cleanup',
          )
          app = once(
              app,
              '    const init = async () => {\n      try {\n',
              "    const init = async () => {\n      try {\n        await PermissionsAndroid.request(\n          PermissionsAndroid.PERMISSIONS.POST_NOTIFICATIONS,\n        );\n",
              'mount-time permission request',
          )
          app = once(
              app,
              '          validResult = await validateSession(data_s);',
              '          const validResult = await validateSession(data_s);',
              'validResult declaration',
          )
          app = once(
              app,
              "          const data = await response.json();\n          if (data && data.android !== APP_VERSION) {\n            setNewVersionAvailable([true, data.android]);\n          }",
              "          const versionMetadata = await response.json();\n          if (versionMetadata && versionMetadata.android !== APP_VERSION) {\n            setNewVersionAvailable([true, versionMetadata.android]);\n          }",
              'version metadata shadow',
          )
          donation_fetch = """
        try {
          const response = await fetchTimeout(METADATA_URL);
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          const data = await response.json();
          if (data) {
            setDonateUrl(data.funding);
          }
        } catch (e) {
          // Silent catch
        }
"""
          app = once(app, donation_fetch, '', 'obsolete donation fetch')
          app = once(
              app,
              '  }, []);\n\n  // Function to convert a server URL',
              '  // Mount-only bootstrap; storage hydration must not rerun on state updates.\n  // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, []);\n\n  // Function to convert a server URL',
              'mount-only effect rationale',
          )
          app = once(
              app,
              '    if (endpoint != null) {',
              '    if (endpoint !== null && endpoint !== undefined) {',
              'endpoint null check',
          )
          app = once(
              app,
              '          hashResult = await hash(data_s, password);\n          data_s = hashResult[2];',
              '          const hashResult = await hash(data_s, password_s);\n          data_s = hashResult[2];',
              'hashResult declaration and correct password argument',
          )
          app = once(
              app,
              '      if (response.status == 204) {',
              '      if (response.status === 204) {',
              'strict logout status comparison',
          )
          start = app.index('  const foregroundService = async () => {')
          end = app.index('  /* Loading Page Handlers */', start)
          block = app[start:end]
          if block.count('wsIsRunning_s') != 4:
              raise SystemExit(
                  'foreground ws variable: expected 4 occurrences, found '
                  + str(block.count('wsIsRunning_s'))
              )
          block = block.replace('wsIsRunning_s', 'nextWsIsRunning')
          block = block.replace(
              '        nextWsIsRunning = wsIsRunning ===',
              '        const nextWsIsRunning = wsIsRunning ===',
              1,
          )
          app = app[:start] + block + app[end:]
          app_path.write_text(app, encoding='utf-8')

          service_path = Path('ClipCascade_Mobile/src/StartForegroundService.js')
          service = service_path.read_text(encoding='utf-8')
          service = once(
              service,
              "import * as encoding from 'text-encoding'; //do not remove this (polyfills for TextEncoder/TextDecoder stompjs)",
              "import { TextEncoder, TextDecoder } from 'text-encoding';",
              'TextEncoder/TextDecoder imports',
          )
          service = once(
              service,
              '  getMultipleDataFromAsyncStorage,\n  clearAsyncStorage,\n',
              '  getMultipleDataFromAsyncStorage,\n',
              'unused service storage import',
          )
          service = service.replace(
              "encryptedData['ciphertext']",
              'encryptedData.ciphertext',
          )
          service = service.replace(
              "encryptedData['nonce']",
              'encryptedData.nonce',
          )
          service = service.replace(
              "encryptedData['tag']",
              'encryptedData.tag',
          )
          service = once(
              service,
              '          const padding = (base64Str.match(/=/g) || []).length;',
              "          const padding = base64Str.endsWith('==')\n            ? 2\n            : base64Str.endsWith('=')\n              ? 1\n              : 0;",
              'base64 padding calculation',
          )
          service = once(
              service,
              '        // generate uuid\n        const generateUuid = async () => {',
              '        // generate uuid\n        /* eslint-disable no-bitwise -- UUID v4 masks are bitwise by definition. */\n        const generateUuid = async () => {',
              'UUID bitwise rationale start',
          )
          service = once(
              service,
              '        };\n\n        const p2pStatusMessageChanged = async () => {',
              '        };\n        /* eslint-enable no-bitwise */\n\n        const p2pStatusMessageChanged = async () => {',
              'UUID bitwise rationale end',
          )
          service = service.replace(' == ', ' === ')
          service = service.replace(' != ', ' !== ')
          service = once(
              service,
              "                } else if (type_ === 'files') {\n                  temp = {};",
              "                } else if (type_ === 'files') {\n                  const temp = {};",
              'P2P file map declaration',
          )
          service = once(
              service,
              '              await clearFiles((expensiveCall = true));',
              '              await clearFiles(true);',
              'clearFiles argument',
          )
          service = service.replace(
              "metadata['combinedRawPayloadSizeInBytes']",
              'metadata.combinedRawPayloadSizeInBytes',
          )
          service_path.write_text(service, encoding='utf-8')

          headless_path = Path('ClipCascade_Mobile/src/HeadlessTask.js')
          headless = headless_path.read_text(encoding='utf-8')
          headless = once(
              headless,
              '  getDataFromAsyncStorage,\n  clearAsyncStorage,\n',
              '  getDataFromAsyncStorage,\n',
              'unused HeadlessTask storage import',
          )
          headless = once(
              headless,
              "    if (data && data['event'] === 'BOOT_COMPLETED') {",
              "    if (data && data.event === 'BOOT_COMPLETED') {",
              'HeadlessTask event access',
          )
          headless_path.write_text(headless, encoding='utf-8')

          Path('ClipCascade_Mobile/src/.eslintrc.js').write_text(
              "module.exports = {\n"
              "  root: true,\n"
              "  extends: '@react-native',\n"
              "  rules: {\n"
              "    // Presentation-only legacy rule; correctness warnings remain enabled.\n"
              "    'react-native/no-inline-styles': 'off',\n"
              "  },\n"
              "};\n",
              encoding='utf-8',
          )
          PY

      - name: Restore the permanent read-only Android workflow
        run: |
          cat > .github/workflows/stability-android.yml <<'YAML'
          name: Stability recovery Android

          on:
            push:
              branches:
                - stability-recovery
              paths:
                - 'ClipCascade_Mobile/**'
                - '.github/workflows/stability-android.yml'
            pull_request:
              branches:
                - main
              paths:
                - 'ClipCascade_Mobile/**'
                - '.github/workflows/stability-android.yml'
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: stability-android-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            build-standalone-apk:
              name: Static audit, tests, and bundled Android APK
              runs-on: ubuntu-latest
              timeout-minutes: 45
              defaults:
                run:
                  shell: bash
                  working-directory: ClipCascade_Mobile/src

              steps:
                - name: Check out source
                  uses: actions/checkout@v4

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: '20'
                    cache: npm
                    cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

                - name: Set up Java
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                    cache: gradle

                - name: Install JavaScript dependencies
                  run: npm ci

                - name: Audit production JavaScript dependencies
                  run: npm audit --omit=dev --audit-level=high

                - name: Run JavaScript static analysis
                  run: |
                    mkdir -p ci-logs/android
                    set -o pipefail
                    npm run lint -- --max-warnings=0 2>&1 | tee ci-logs/android/eslint.log

                - name: Run JavaScript reliability tests
                  run: |
                    mkdir -p ci-logs/android
                    set -o pipefail
                    npm test -- --runInBand 2>&1 | tee ci-logs/android/jest.log

                - name: Run Android lint and tests, then build standalone APK
                  run: |
                    mkdir -p ci-logs/android
                    chmod +x android/gradlew
                    set -o pipefail
                    (cd android && ./gradlew --no-daemon --stacktrace :app:lintStandalone :app:testDebugUnitTest :app:assembleStandalone) 2>&1 | tee ci-logs/android/gradle-build.log

                - name: Upload build logs
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: ClipCascade-stability-android-build-log
                    path: ClipCascade_Mobile/src/ci-logs/android/
                    if-no-files-found: warn
                    retention-days: 30

                - name: Verify bundled JavaScript and stage APK
                  run: |
                    set -euo pipefail
                    APK_PATH=android/app/build/outputs/apk/standalone/app-standalone.apk
                    test -f "$APK_PATH"
                    unzip -Z1 "$APK_PATH" | grep -Fxq 'assets/index.android.bundle'
                    unzip -tq "$APK_PATH"
                    mkdir -p ci-artifacts/android
                    cp "$APK_PATH" ci-artifacts/android/ClipCascade-Android-stability-standalone.apk
                    cd ci-artifacts/android
                    sha256sum ClipCascade-Android-stability-standalone.apk > SHA256SUMS.txt
                    sha256sum -c SHA256SUMS.txt
                    cat SHA256SUMS.txt

                - name: Upload installable engineering APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: ClipCascade-Android-stability-standalone
                    path: ClipCascade_Mobile/src/ci-artifacts/android/
                    if-no-files-found: error
                    retention-days: 30
          YAML
          rm -f .github/workflows/one-shot-eslint-repair.yml

      - name: Install dependencies and verify the repaired source
        working-directory: ClipCascade_Mobile/src
        run: |
          set -euo pipefail
          npm ci
          node --check App.js
          node --check StartForegroundService.js
          node --check HeadlessTask.js
          npm run lint -- --max-warnings=0
          npm test -- --runInBand

      - name: Commit repaired source and restored workflows
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ClipCascade_Mobile/src/App.js \
                  ClipCascade_Mobile/src/StartForegroundService.js \
                  ClipCascade_Mobile/src/HeadlessTask.js \
                  ClipCascade_Mobile/src/.eslintrc.js \
                  .github/workflows/stability-android.yml \
                  .github/workflows/one-shot-eslint-repair.yml
          git commit -m 'fix(mobile): repair static-analysis defects'
          git push origin HEAD:stability-recovery
