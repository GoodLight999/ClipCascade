name: One-time verified mobile repair

# The patch is applied to a clean checkout and committed only after syntax,
# ESLint, and Jest all succeed.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/mobile-static-repair.patch'
      - '.github/workflows/stability-android.yml'

permissions:
  contents: write

concurrency:
  group: one-time-mobile-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: stability-recovery
          fetch-depth: 0

      - name: Apply exact reviewed patch
        run: |
          set -euo pipefail
          git apply --check -p1 tools/mobile-static-repair.patch
          git apply -p1 tools/mobile-static-repair.patch
          git diff --check

      - name: Install JavaScript dependencies
        working-directory: ClipCascade_Mobile/src
        run: npm ci

      - name: Validate repaired JavaScript
        working-directory: ClipCascade_Mobile/src
        run: |
          set -euo pipefail
          node --check App.js
          node --check StartForegroundService.js
          node --check HeadlessTask.js
          npm run lint -- --max-warnings=0
          npm test -- --runInBand

      - name: Commit only the validated product changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ClipCascade_Mobile/src/App.js \
            ClipCascade_Mobile/src/StartForegroundService.js \
            ClipCascade_Mobile/src/HeadlessTask.js
          git commit -m 'fix(mobile): repair static-analysis defects'
          git push origin HEAD:stability-recovery
