name: Desktop Windows CI

on:
  push:
    branches:
      - stability-mobile-otp
  pull_request:
    paths:
      - "ClipCascade_Desktop/src/**"
      - ".github/workflows/desktop-python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CLIPCASCADE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    defaults:
      run:
        working-directory: ClipCascade_Desktop/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ClipCascade_Desktop/src/requirements_win.txt

      - name: Prepare build identity
        run: python scripts/prepare_build_info.py

      - name: Prepare P2P peer acknowledgement
        run: python scripts/prepare_p2p_peer_ack.py

      - name: Prepare Windows tray lifecycle and watchdog bounds
        run: python scripts/prepare_windows_tray_lifecycle.py

      - name: Compile desktop sources
        run: python -m compileall -q .

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -r requirements_win.txt

      - name: Test authenticated HTTP handling
        run: python -m unittest tests.test_request_manager -v

      - name: Test P2P peer acknowledgement
        run: python -m unittest tests.test_p2p_peer_ack -v

      - name: Test Windows shutdown and status wording
        run: python -m unittest tests.test_windows_shutdown -v

      - name: Test Windows tray lifecycle and scheme diagnostics
        run: python -m unittest tests.test_windows_tray_lifecycle -v

      - name: Build standalone executable
        run: python -m PyInstaller --clean ClipCascade_win.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Windows
          path: ClipCascade_Desktop/src/dist/ClipCascade.exe
          if-no-files-found: error
