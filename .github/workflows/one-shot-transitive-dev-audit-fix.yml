name: One-shot nonbreaking transitive audit fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-transitive-dev-audit-fix.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-transitive-dev-audit-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
        working-directory: ClipCascade_Mobile/src

    steps:
      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: stability-recovery
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply only npm's nonbreaking lockfile fixes
        run: |
          set -euo pipefail
          cp package.json package.json.before-audit-fix
          # npm exits 1 while moderate CLI advisories remain even after all
          # nonbreaking high-severity fixes are applied. The resulting audits
          # below, not this intermediate exit code, are the acceptance gate.
          npm audit fix --package-lock-only || true
          cmp package.json package.json.before-audit-fix
          rm package.json.before-audit-fix
          git diff --check
          git diff -- package-lock.json
          test -n "$(git diff -- package-lock.json)"

      - name: Install the exact repaired tree
        run: npm ci

      - name: Enforce full and production high-or-higher audits
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Validate JavaScript and contracts
        run: |
          set -euo pipefail
          node --check App.js
          node --check StartForegroundService.js
          node --check HeadlessTask.js
          npm run lint -- --max-warnings=0
          npm test -- --runInBand

      - name: Validate Android lint, JVM tests, and APK
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace \
            :app:lintStandalone \
            :app:testDebugUnitTest \
            :app:assembleStandalone
          apk=app/build/outputs/apk/standalone/app-standalone.apk
          test -f "$apk"
          unzip -Z1 "$apk" | grep -Fxq assets/index.android.bundle
          unzip -tq "$apk"
          sha256sum "$apk"

      - name: Commit only the validated lockfile
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ClipCascade_Mobile/src/package-lock.json
          git commit -m 'fix(mobile): update nonbreaking transitive dependencies'
          git push origin HEAD:stability-recovery
