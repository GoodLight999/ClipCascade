name: Dependency audit trial

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/dependency-audit-trial.yml'

permissions:
  contents: read

jobs:
  compatible-update-trial:
    name: Dependency candidate (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cli-only
            react_native: '0.80.2'
          - variant: rn-patch
            react_native: '0.80.3'
    defaults:
      run:
        shell: bash
        working-directory: ClipCascade_Mobile/src

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-recovery

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply bounded compatible updates in the trial workspace
        id: candidate
        run: |
          set -euo pipefail
          mkdir -p ci-logs/dependency-trial
          npm pkg set dependencies.react-native='${{ matrix.react_native }}'
          npm pkg set devDependencies.@react-native-community/cli=19.1.2
          npm pkg set devDependencies.@react-native-community/cli-platform-android=19.1.2
          npm pkg set devDependencies.@react-native-community/cli-platform-ios=19.1.2
          npm install --package-lock-only --ignore-scripts \
            2>&1 | tee ci-logs/dependency-trial/lock-update.log
          # Do not force the CLI 20 major. Safe transitive fixes within the
          # selected dependency graph are allowed; remaining moderate-only
          # build-tool advisories are recorded rather than hidden.
          npm audit fix --package-lock-only --omit=dev \
            2>&1 | tee ci-logs/dependency-trial/audit-fix.log || true
          git diff -- package.json package-lock.json > dependency-update.diff
          test -s dependency-update.diff

      - name: Install candidate dependency tree
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ci-logs/dependency-trial/npm-ci.log

      - name: Record production dependency audit
        id: audit
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high \
            2>&1 | tee ci-logs/dependency-trial/npm-audit.txt
          npm audit --omit=dev --json \
            > ci-logs/dependency-trial/npm-audit.json || true

      - name: Run JavaScript static analysis and tests
        id: javascript
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node --check App.js
            node --check StartForegroundService.js
            node --check HeadlessTask.js
            npm run lint -- --max-warnings=0
            npm test -- --runInBand
          } 2>&1 | tee ci-logs/dependency-trial/javascript.log

      - name: Run Android lint, JVM tests, and standalone build
        id: android
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          chmod +x android/gradlew
          set -o pipefail
          (cd android && ./gradlew --no-daemon --stacktrace \
            :app:lintStandalone \
            :app:testDebugUnitTest \
            :app:assembleStandalone) \
            2>&1 | tee ci-logs/dependency-trial/gradle-build.log

      - name: Verify trial APK
        id: package_verify
        if: always() && steps.android.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/standalone/app-standalone.apk
          test -f "$apk"
          unzip -Z1 "$apk" | grep -Fxq assets/index.android.bundle
          unzip -tq "$apk"
          sha256sum "$apk" > ci-logs/dependency-trial/APK-SHA256SUMS.txt
          sha256sum -c ci-logs/dependency-trial/APK-SHA256SUMS.txt

      - name: Stage complete trial evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/dependency-trial
          cp package.json package-lock.json dependency-update.diff \
            ci-artifacts/dependency-trial/
          cp -a ci-logs/dependency-trial/. ci-artifacts/dependency-trial/
          cat > ci-artifacts/dependency-trial/outcomes.txt <<'EOF'
          variant=${{ matrix.variant }}
          react-native=${{ matrix.react_native }}
          install=${{ steps.install.outcome }}
          audit-high=${{ steps.audit.outcome }}
          javascript=${{ steps.javascript.outcome }}
          android=${{ steps.android.outcome }}
          package-verify=${{ steps.package_verify.outcome }}
          EOF

      - name: Upload complete trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-dependency-trial-${{ matrix.variant }}
          path: ClipCascade_Mobile/src/ci-artifacts/dependency-trial/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce every candidate gate
        if: always()
        run: |
          set -euo pipefail
          cat ci-artifacts/dependency-trial/outcomes.txt
          test '${{ steps.install.outcome }}' = success
          test '${{ steps.audit.outcome }}' = success
          test '${{ steps.javascript.outcome }}' = success
          test '${{ steps.android.outcome }}' = success
          test '${{ steps.package_verify.outcome }}' = success
