name: Update diagnostic handoff once

on:
  push:
    branches:
      - stability-recovery
    paths:
      - '.github/workflows/update-diagnostic-report-docs.yml'
      - '.github/scripts/update_diagnostic_report_docs.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: stability-recovery
      - name: Apply exact documentation update
        run: python .github/scripts/update_diagnostic_report_docs.py
      - name: Commit canonical documents only
        run: |
          if git diff --quiet; then
            echo 'Documentation is already current.'
            exit 0
          fi
          git config user.name 'ClipCascade recovery automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/HANDOFF.md docs/EXPERIMENT_LOG.md
          git commit -m 'docs: record DIAGNOSTIC-REPORT-001 and latest artifacts'
          git push origin HEAD:stability-recovery
