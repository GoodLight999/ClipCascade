name: Package fork release

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: ClipCascade_Desktop/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ClipCascade_Desktop/src/requirements_win.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -r requirements_win.txt

      - name: Build standalone executable
        run: python -m PyInstaller --clean ClipCascade_win.spec

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path dist/ClipCascade.exe -DestinationPath ClipCascade-Windows.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: ClipCascade_Desktop/src/ClipCascade-Windows.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: ClipCascade_Mobile/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build installable Android APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ClipCascade-Android.apk

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: ClipCascade_Mobile/src/ClipCascade-Android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/fork-v')
    needs:
      - windows
      - android
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release

      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: android-package
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/ClipCascade-Windows.zip
          release/ClipCascade-Android.apk
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --title "ClipCascade ${GITHUB_REF_NAME}"
