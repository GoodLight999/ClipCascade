name: Package extended release

on:
  push:
    tags:
      - "extended-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: ClipCascade_Desktop/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ClipCascade_Desktop/src/requirements_win.txt

      - name: Prepare P2P peer acknowledgement
        run: python scripts/prepare_p2p_peer_ack.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -r requirements_win.txt

      - name: Test P2P peer acknowledgement
        run: python -m unittest tests.test_p2p_peer_ack -v

      - name: Build standalone executable
        run: python -m PyInstaller --clean ClipCascade_win.spec

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path dist/ClipCascade.exe -DestinationPath ClipCascade-Windows.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: ClipCascade_Desktop/src/ClipCascade-Windows.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: ClipCascade_Mobile/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare Extended interface
        run: node scripts/prepare_extended_bundle.js

      - name: Prepare relay transport acknowledgement
        run: node scripts/prepare_relay_transport_ack.js

      - name: Order relay startup after listeners
        run: node scripts/prepare_relay_startup_order.js

      - name: Isolate service listener lifecycle
        run: node scripts/prepare_service_listener_lifecycle.js

      - name: Prepare P2P peer acknowledgement
        run: node scripts/prepare_p2p_peer_ack.js

      - name: Order P2P ACK after validation
        run: node scripts/prepare_p2p_ack_validation_order.js

      - name: Bundle JavaScript into Android assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          test -s android/app/src/main/assets/index.android.bundle

      - name: Test and build installable Android APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            -PclipcascadeBuildSha="${GITHUB_SHA}" \
            --stacktrace

      - name: Verify and rename APK
        shell: bash
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.android.bundle"
          cp android/app/build/outputs/apk/debug/app-debug.apk ClipCascade-Extended-Android.apk

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: ClipCascade_Mobile/src/ClipCascade-Extended-Android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/extended-v')
    needs:
      - windows
      - android
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release

      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: android-package
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/ClipCascade-Windows.zip
          release/ClipCascade-Extended-Android.apk
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --title "ClipCascade Extended ${GITHUB_REF_NAME}"
