# Project-wide Gradle settings.

# IDE settings override values configured in this file.
# See https://docs.gradle.org/current/userguide/build_environment.html

# Gradle daemon memory settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Use AndroidX dependencies.
android.useAndroidX=true

# Architectures included in the default Android build.
# Override with -PreactNativeArchitectures=<architecture> when needed.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# React Native 0.80 template defaults.
newArchEnabled=true
hermesEnabled=true
