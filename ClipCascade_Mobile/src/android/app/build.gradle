apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def clipcascadeBuildSha = (project.findProperty("clipcascadeBuildSha") ?: "local").toString()

def quotedBuildSha = "\"${clipcascadeBuildSha.replace('\\', '\\\\').replace('\"', '\\\"')}\""

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.clipcascade"
    defaultConfig {
        applicationId "com.clipcascade"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 320105
        versionName "3.2.1-extended.2"
        buildConfigField "String", "SOURCE_COMMIT", quotedBuildSha
    }

    buildTypes {
        debug {
            applicationIdSuffix ".extended"
            versionNameSuffix "-standalone"
            resValue "string", "app_name", "ClipCascade Extended"
        }
        release {
            applicationIdSuffix ".extended.release"
            versionNameSuffix "-release"
            resValue "string", "app_name", "ClipCascade Extended"
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if ((project.findProperty("hermesEnabled") ?: "true").toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation "com.google.guava:guava:33.4.8-android"
    implementation "androidx.work:work-runtime-ktx:2.10.3"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"

    testImplementation "junit:junit:4.13.2"
}
